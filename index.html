s par un responsable de service. Les dossiers validés par un responsable sont transmis au service financier pour paiement. Aucun dossier non signé n'est transmis au service financier. Certains dossiers inférieurs à 500 euros sont payés sans validation d'un responsable.", "title": "Texte 2", "q": "Tout dossier de plus de 500 euros doit être signé par le demandeur et validé par un responsable.", "a": "V", "e": "Les deux conditions sont énoncées pour les dossiers dépassant 500 euros."}, {"passage": "Dans une administration, tout dossier de remboursement doit être signé par le demandeur. Les dossiers dont le montant dépasse 500 euros doivent en outre être validés par un responsable de service. Les dossiers validés par un responsable sont transmis au service financier pour paiement. Aucun dossier non signé n'est transmis au service financier. Certains dossiers inférieurs à 500 euros sont payés sans validation d'un responsable.", "title": "Texte 2", "q": "Tous les dossiers validés par un responsable dépassent 500 euros.", "a": "I", "e": "Le texte impose la validation au-dessus de 500 euros, mais ne dit pas qu'elle est réservée à ces dossiers."}, {"passage": "Dans une administration, tout dossier de remboursement doit être signé par le demandeur. Les dossiers dont le montant dépasse 500 euros doivent en outre être validés par un responsable de service. Les dossiers validés par un responsable sont transmis au service financier pour paiement. Aucun dossier non signé n'est transmis au service financier. Certains dossiers inférieurs à 500 euros sont payés sans validation d'un responsable.", "title": "Texte 2", "q": "Un dossier de 300 euros non signé peut être transmis au service financier.", "a": "F", "e": "Aucun dossier non signé n'est transmis, quel que soit son montant."}, {"passage": "Une enquête menée auprès de 500 agents d'une administration indique que 45 % d'entre eux utilisent les transports en commun pour se rendre au travail, 30 % utilisent la voiture et 25 % se déplacent à vélo ou à pied. Parmi les utilisateurs de la voiture, 40 % pratiquent le covoiturage. L'enquête n'a pas interrogé les agents en télétravail à temps plein.", "title": "Texte 3", "q": "Moins de 150 agents interrogés ne se déplacent ni en voiture ni en transports en commun.", "a": "V", "e": "25 % de 500 = 125 agents (vélo ou à pied), soit moins de 150."}, {"passage": "Une enquête menée auprès de 500 agents d'une administration indique que 45 % d'entre eux utilisent les transports en commun pour se rendre au travail, 30 % utilisent la voiture et 25 % se déplacent à vélo ou à pied. Parmi les utilisateurs de la voiture, 40 % pratiquent le covoiturage. L'enquête n'a pas interrogé les agents en télétravail à temps plein.", "title": "Texte 3", "q": "60 agents interrogés pratiquent le covoiturage.", "a": "V", "e": "30 % de 500 = 150 conducteurs ; 40 % de 150 = 60."}, {"passage": "Une enquête menée auprès de 500 agents d'une administration indique que 45 % d'entre eux utilisent les transports en commun pour se rendre au travail, 30 % utilisent la voiture et 25 % se déplacent à vélo ou à pied. Parmi les utilisateurs de la voiture, 40 % pratiquent le covoiturage. L'enquête n'a pas interrogé les agents en télétravail à temps plein.", "title": "Texte 3", "q": "L'enquête montre que le télétravail réduit l'usage de la voiture.", "a": "I", "e": "Les télétravailleurs n'ont pas été interrogés : l'enquête ne dit rien de cet effet."}, {"passage": "Une enquête menée auprès de 500 agents d'une administration indique que 45 % d'entre eux utilisent les transports en commun pour se rendre au travail, 30 % utilisent la voiture et 25 % se déplacent à vélo ou à pied. Parmi les utilisateurs de la voiture, 40 % pratiquent le covoiturage. L'enquête n'a pas interrogé les agents en télétravail à temps plein.", "title": "Texte 3", "q": "Le nombre d'agents utilisant les transports en commun est supérieur au double du nombre d'agents utilisant la voiture.", "a": "F", "e": "225 agents contre 150 : 225 est inférieur à 300."}, {"passage": "Un institut de recherche a publié une étude selon laquelle les entreprises ayant adopté la semaine de quatre jours ont enregistré une hausse moyenne de productivité de 8 %. L'étude porte sur 60 entreprises volontaires, toutes situées dans le secteur des services. Les auteurs soulignent que ces résultats ne peuvent pas être généralisés aux autres secteurs et qu'une étude à plus grande échelle serait nécessaire pour confirmer l'effet observé.", "title": "Texte 4", "q": "L'étude a été menée uniquement auprès d'entreprises ayant choisi d'y participer.", "a": "V", "e": "Les 60 entreprises sont décrites comme volontaires."}, {"passage": "Un institut de recherche a publié une étude selon laquelle les entreprises ayant adopté la semaine de quatre jours ont enregistré une hausse moyenne de productivité de 8 %. L'étude porte sur 60 entreprises volontaires, toutes situées dans le secteur des services. Les auteurs soulignent que ces résultats ne peuvent pas être généralisés aux autres secteurs et qu'une étude à plus grande échelle serait nécessaire pour confirmer l'effet observé.", "title": "Texte 4", "q": "Les auteurs estiment que la semaine de quatre jours augmente la productivité dans tous les secteurs.", "a": "F", "e": "Ils soulignent au contraire que les résultats ne peuvent pas être généralisés."}, {"passage": "Un institut de recherche a publié une étude selon laquelle les entreprises ayant adopté la semaine de quatre jours ont enregistré une hausse moyenne de productivité de 8 %. L'étude porte sur 60 entreprises volontaires, toutes situées dans le secteur des services. Les auteurs soulignent que ces résultats ne peuvent pas être généralisés aux autres secteurs et qu'une étude à plus grande échelle serait nécessaire pour confirmer l'effet observé.", "title": "Texte 4", "q": "La productivité des entreprises du secteur industriel a augmenté de 8 % en moyenne.", "a": "I", "e": "L'étude ne porte que sur les services : rien n'est dit ": [{"title": "T1", "passage": "Le programme Erasmus-Pro a financé 4 800 stages en 2023, soit 20 % de plus qu'en 2022. Parmi les stagiaires, 65 % étaient des femmes. Le budget total était de 36 millions d'euros, dont 70 % provenaient du budget européen, le reste de cofinancements nationaux. La durée moyenne des stages était de 4 mois. Aucune donnée n'est disponible pour les stages financés uniquement par des régions.", "q": "Le programme a financé 4 000 stages en 2022.", "a": "V", "e": "4 800 / 1,2 = 4 000."}, {"title": "T1", "passage": "Le programme Erasmus-Pro a financé 4 800 stages en 2023, soit 20 % de plus qu'en 2022. Parmi les stagiaires, 65 % étaient des femmes. Le budget total était de 36 millions d'euros, dont 70 % provenaient du budget européen, le reste de cofinancements nationaux. La durée moyenne des stages était de 4 mois. Aucune donnée n'est disponible pour les stages financés uniquement par des régions.", "q": "Moins de 2 000 stagiaires étaient des hommes.", "a": "V", "e": "35 % de 4 800 = 1 680."}, {"title": "T1", "passage": "Le programme Erasmus-Pro a financé 4 800 stages en 2023, soit 20 % de plus qu'en 2022. Parmi les stagiaires, 65 % étaient des femmes. Le budget total était de 36 millions d'euros, dont 70 % provenaient du budget européen, le reste de cofinancements nationaux. La durée moyenne des stages était de 4 mois. Aucune donnée n'est disponible pour les stages financés uniquement par des régions.", "q": "Les cofinancements nationaux ont dépassé 11 millions d'euros.", "a": "F", "e": "30 % de 36 M€ = 10,8 M€, soit moins de 11 M€."}, {"title": "T1", "passage": "Le programme Erasmus-Pro a financé 4 800 stages en 2023, soit 20 % de plus qu'en 2022. Parmi les stagiaires, 65 % étaient des femmes. Le budget total était de 36 millions d'euros, dont 70 % provenaient du budget européen, le reste de cofinancements nationaux. La durée moyenne des stages était de 4 mois. Aucune donnée n'est disponible pour les stages financés uniquement par des régions.", "q": "Les stages financés par des régions étaient plus courts que la moyenne.", "a": "I", "e": "Le texte dit qu'aucune donnée n'est disponible sur ces stages."}, {"title": "T2", "passage": "Tout fonctionnaire qui souhaite télétravailler doit en faire la demande à son supérieur. Le supérieur dispose de dix jours pour répondre. En l'absence de réponse au terme de ce délai, la demande est réputée acceptée, sauf pour les agents en période d'essai, dont la demande doit toujours recevoir une réponse expresse. Tout refus doit être motivé par écrit.", "q": "La demande d'un agent en période d'essai restée sans réponse après dix jours n'est pas réputée acceptée.", "a": "V", "e": "L'acceptation tacite ne s'applique pas aux agents en période d'essai."}, {"title": "T2", "passage": "Tout fonctionnaire qui souhaite télétravailler doit en faire la demande à son supérieur. Le supérieur dispose de dix jours pour répondre. En l'absence de réponse au terme de ce délai, la demande est réputée acceptée, sauf pour les agents en période d'essai, dont la demande doit toujours recevoir une réponse expresse. Tout refus doit être motivé par écrit.", "q": "Un supérieur peut refuser une demande de télétravail sans en indiquer les raisons.", "a": "F", "e": "Tout refus doit être motivé par écrit."}, {"title": "T2", "passage": "Tout fonctionnaire qui souhaite télétravailler doit en faire la demande à son supérieur. Le supérieur dispose de dix jours pour répondre. En l'absence de réponse au terme de ce délai, la demande est réputée acceptée, sauf pour les agents en période d'essai, dont la demande doit toujours recevoir une réponse expresse. Tout refus doit être motivé par écrit.", "q": "Un agent titulaire dont le supérieur n'a pas répondu après onze jours peut télétravailler.", "a": "V", "e": "Le délai de dix jours est dépassé : la demande est réputée acceptée."}, {"title": "T2", "passage": "Tout fonctionnaire qui souhaite télétravailler doit en faire la demande à son supérieur. Le supérieur dispose de dix jours pour répondre. En l'absence de réponse au terme de ce délai, la demande est réputée acceptée, sauf pour les agents en période d'essai, dont la demande doit toujours recevoir une réponse expresse. Tout refus doit être motivé par écrit.", "q": "Les agents en période d'essai n'ont pas le droit de télétravailler.", "a": "I", "e": "Le texte précise seulement la procédure applicable à leur demande."}, {"title": "T3", "passage": "Un sondage mené auprès de 1 200 habitants d'une région indique que 55 % d'entre eux utilisent quotidiennement les services administratifs en ligne. Parmi ces utilisateurs quotidiens, 80 % se disent satisfaits. Parmi ceux qui ne les utilisent pas quotidiennement, 30 % se disent satisfaits. Le sondage ne précise pas l'âge des répondants.", "q": "Plus de la moitié des personnes interrogées se disent satisfaites.", "a": "V", "e": "528 + 162 = 690 satisfaits sur 1 200, soit 57,5 %."}, {"title": "T3", "passage": "Un sondage mené auprès de 1 200 habitants d'une région indique que 55 % d'entre eux utilisent quotidiennement les services administratifs en ligne. Parmi ces utilisateurs quotidiens, 80 % se disent satisfaits. Parmi ceux qui ne les utilisent pas quotidiennement, 30 % se disent satisfaits. Le sondage ne précise pas l'âge des répondants.", "q": "162 répondants qui n'utilisent pas quotidiennement ces services se disent satisfaits.", "a": "V", "e": "540 x 30 % = 162."}, {"title": "T3", "passage": "Un sondage mené auprès de 1 200 habitants d'une région indique que 55 % d'entre eux utilisent quotidiennement les services administratifs en ligne. Parmi ces utilisateurs quotidiens, 80 % se disent satisfaits. Parmi ceux qui ne les utilisent pas quotidiennement, 30 % se disent satisfaits. Le sondage ne précise pas l'âge des répondants.", "q": "Les jeunes utilisent davantage ces services que les personnes âgées.", "a": "I", "e": "L'âge des répondants n'est pas précisé."}, {"title": "T3", "passage": "Un sondage mené auprès de 1 200 habitants d'une région indique que 55 % d'entre eux utilisent quotidiennement les services administratifs en ligne. Parmi ces utilisateurs quotidiens, 80 % se disent satisfaits. Parmi ceux qui ne les utilisent pas quotidiennement, 30 % se disent satisfaits. Le sondage ne précise pas l'âge des répondants.", "q": "Il y a plus de répondants insatisfaits parmi les utilisateurs quotidiens que parmi les autres.", "a": "F", "e": "132 insatisfaits chez les utilisateurs quotidiens contre 378 chez les autres."}, {"title": "T4", "passage": "Un rapport d'audit conclut que le service des achats a respecté les procédures dans 92 % des 250 marchés examinés. Les marchés non conformes concernaient principalement des montants inférieurs à 10 000 euros. Le rapport recommande de renforcer la formation des agents, sans exclure d'autres mesures. La direction a indiqué qu'elle examinerait ces recommandations avant la fin de l'année.", "q": "Vingt marchés examinés n'étaient pas conformes aux procédures.", "a": "V", "e": "8 % de 250 = 20."}, {"title": "T4", "passage": "Un rapport d'audit conclut que le service des achats a respecté les procédures dans 92 % des 250 marchés examinés. Les marchés non conformes concernaient principalement des montants inférieurs à 10 000 euros. Le rapport recommande de renforcer la formation des agents, sans exclure d'autres mesures. La direction a indiqué qu'elle examinerait ces recommandations avant la fin de l'année.", "q": "Le rapport recommande uniquement de renforcer la formation des agents.", "a": "F", "e": "Il n'exclut pas d'autres mesures."}, {"title": "T4", "passage": "Un rapport d'audit conclut que le service des achats a respecté les procédures dans 92 % des 250 marchés examinés. Les marchés non conformes concernaient principalement des montants inférieurs à 10 000 euros. Le rapport recommande de renforcer la formation des agents, sans exclure d'autres mesures. La direction a indiqué qu'elle examinerait ces recommandations avant la fin de l'année.", "q": "La direction a accepté de mettre en oeuvre toutes les recommandations.", "a": "I", "e": "Elle a seulement indiqué qu'elle les examinerait."}, {"title": "T4", "passage": "Un rapport d'audit conclut que le service des achats a respecté les procédures dans 92 % des 250 marchés examinés. Les marchés non conformes concernaient principalement des montants inférieurs à 10 000 euros. Le rapport recommande de renforcer la formation des agents, sans exclure d'autres mesures. La direction a indiqué qu'elle examinerait ces recommandations avant la fin de l'année.", "q": "La majorité des marchés non conformes portaient sur des montants supérieurs à 10 000 euros.", "a": "F", "e": "Ils concernaient principalement des montants inférieurs à 10 000 euros."}, {"title": "T5", "passage": "Une directive prévoit que les États membres la transposent avant le 1er janvier 2025. Les États qui n'ont pas transposé la directive à cette date s'exposent à une procédure d'infraction. Au 1er février 2025, vingt États sur vingt-sept avaient transposé la directive ; les sept autres étaient en retard. Parmi ces sept États, trois ont indiqué qu'ils achèveraient la transposition dans les six mois.", "q": "Au 1er février 2025, plus de 70 % des États membres avaient transposé la directive.", "a": "V", "e": "20 / 27 = 74 %."}, {"title": "T5", "passage": "Une directive prévoit que les États membres la transposent avant le 1er janvier 2025. Les États qui n'ont pas transposé la directive à cette date s'exposent à une procédure d'infraction. Au 1er février 2025, vingt États sur vingt-sept avaient transposé la directive ; les sept autres étaient en retard. Parmi ces sept États, trois ont indiqué qu'ils achèveraient la transposition dans les six mois.", "q": "La Commission a ouvert une procédure d'infraction contre les sept États en retard.", "a": "I", "e": "Le texte dit qu'ils s'y exposent, pas qu'une procédure a été ouverte."}, {"title": "T5", "passage": "Une directive prévoit que les États membres la transpos  <ul><li>Le chronomètre démarre à l'ouverture de chaque épreuve et la ferme automatiquement à zéro.</li><li>Pas de retour à une épreuve terminée. Dans une épreuve, vous pouvez naviguer et marquer des questions à revoir.</li><li>Calculatrice disponible en numérique.</li><li>Un rapport détaillé s'affiche à la fin. Ne fermez pas l'onglet avant de l'avoir consulté.</li></ul>
 <p><b>Série :</b> <select id="setsel" onchange="DATA=SETS[+this.value];setName=this.options[this.selectedIndex].text"><option value="0">Série 1</option><option value="1">Série 2</option></select></p>
 <button onclick="startSec(0)">Commencer le test</button>
 <p class="small">Outil d'entraînement non officiel, sans lien avec l'EPSO.</p></div>`}
function startSec(i){si=i;qi=0;const s=SECS[i];left=Math.round(s.min*60/(fast?10:1));
 app.innerHTML=`<div class="card"><h2>Épreuve ${i+1}/3 – ${s.name}</h2><p>${DATA[s.k].length} questions – ${s.min} minutes.</p>${s.k=="verbal"?"<p>Répondez d'après le texte uniquement : Vrai, Faux ou Impossible à dire.</p>":s.k=="numerical"?"<p>Une seule réponse correcte par question. Calculatrice disponible.</p>":"<p>Trouvez la figure qui complète chaque série.</p>"}<button onclick="begin()">Démarrer l'épreuve et le chronomètre</button></div>`}
function begin(){$("#timer").style.display="";$("#sec").textContent=SECS[si].name;$("#calc").style.display="none";clearInterval(tick);tick=setInterval(()=>{left--;paint();if(left<=0)finish(true)},1000);paint();render()}
function paint(){const l=Math.max(left,0),m=Math.floor(l/60),s=l%60,t=$("#timer");t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");t.classList.toggle("low",l<=60)}
// shared body: shows question + support; mode "test" (clickable) or "rev" (marks)
function body(k,q,sel,mode){let h="";const clk=i=>mode=="test"?`onclick="pick(${i})"`:"";
 const cls=(v,i)=>{if(mode=="test")return sel===v?"sel":"";return v===q.a?"good":(sel===v?"bad":"")};
 if(k=="verbal"){h+=`<div class="passage">${q.passage}</div><p><b>${q.q}</b></p>`+["V","F","I"].map(c=>`<label class="opt ${cls(c)}" ${clk("'"+c+"'")}>${VL[c]}${mode=="rev"&&c==q.a?" ✔ bonne réponse":""}${mode=="rev"&&c==sel&&c!=q.a?" ✘ votre réponse":""}</label>`).join("")}
 else if(k=="numerical"){if(q.table)h+=`<table class="d">${q.table.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("")}</table>`;h+=`<p><b>${q.q}</b></p>`+q.opts.map((o,i)=>`<label class="opt ${cls(i)}" ${clk(i)}>${LET[i]}. ${o}${mode=="rev"&&i==q.a?" ✔ bonne réponse":""}${mode=="rev"&&i==sel&&i!=q.a?" ✘ votre réponse":""}</label>`).join("")}
 else{h+=`<p>Quelle figure complète la série ?</p>`;const c=q.seq.concat([q.q]);
  h+=q.matrix?`<div class="grid3">${c.map(s=>`<div>${s}</div>`).join("")}</div>`:`<div class="seq">${c.map(s=>`<div class="fig">${s}</div>`).join("")}</div>`;
  h+=`<div class="opts">${q.opts.map((o,i)=>`<div class="ob ${cls(i)}" ${clk(i)}><div class="fig">${o}</div><b>${LET[i]}${mode=="rev"&&i==q.a?" ✔":""}${mode=="rev"&&i==sel&&i!=q.a?" ✘ (votre choix)":""}</b></div>`).join("")}</div>`}
 return h}
function render(){const k=SECS[si].k,q=DATA[k][qi],n=DATA[k].length;let h=`<div class="card"><div class="row"><b>Question ${qi+1} / ${n}</b><span class="sp"></span>${k=="numerical"?'<button class="sec" onclick="toggleCalc()">Calculatrice</button>':""}<button class="sec" onclick="fl()">${flag[k][qi]?"Retirer le drapeau":"Marquer à revoir"}</button></div><hr>`+body(k,q,ans[k][qi],"test")+`</div>
 <div class="card"><div class="nav">${DATA[k].map((_,i)=>`<button class="${ans[k][i]!==undefined?"ans":""} ${flag[k][i]?"flag":""} ${i==qi?"cur":""}" onclick="go(${i})">${i+1}</button>`).join("")}</div>
 <div class="row"><button class="sec" onclick="go(qi-1)" ${qi==0?"disabled":""}>Précédent</button><button class="sec" onclick="go(qi+1)" ${qi==n-1?"disabled":""}>Suivant</button><span class="sp"></span><button onclick="confirmEnd()">Terminer l'épreuve</button></div><p class="small">Réponses : ${ans[k].filter(x=>x!==undefined).length}/${n} · Drapeaux : ${flag[k].filter(Boolean).length}</p></div>`;app.innerHTML=h}
function pick(v){ans[SECS[si].k][qi]=v;render()}function go(i){if(i>=0&&i<DATA[SECS[si].k].length){qi=i;render()}}
function fl(){const k=SECS[si].k;flag[k][qi]=!flag[k][qi];render()}
function confirmEnd(){const k=SECS[si].k,u=DATA[k].length-ans[k].filter(x=>x!==undefined).length;if(confirm(u?`${u} question(s) sans réponse. Terminer l'épreuve ?`:"Terminer l'épreuve ?"))finish(false)}
function finish(auto){clearInterval(tick);$("#calc").style.display="none";$("#timer").style.display="none";res[SECS[si].k]={left:Math.max(left,0),auto};
 if(si<2){app.innerHTML=`<div class="card"><h2>${SECS[si].name} terminée</h2>${auto?"<p>Le temps est écoulé.</p>":""}<p>Prochaine épreuve : <b>${SECS[si+1].name}</b>. Prenez quelques secondes, puis continuez.</p><button onclick="startSec(${si+1})">Épreuve suivante</button></div>`}
 else report()}
function mmss(s){return Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")+" s"}
function report(filter){filter=filter||"all";$("#sec").textContent="Rapport";
 let tot=0,max=0,rows="",det="";
 SECS.forEach(s=>{const k=s.k;let ok=0,bad=0,blank=0;DATA[k].forEach((q,i)=>{const y=ans[k][i];if(y===undefined)blank++;else if(y===q.a)ok++;else bad++});
  tot+=ok;max+=DATA[k].length;const used=s.min*60/(fast?10:1)-res[k].left;
  rows+=`<tr><td style="text-align:left"><b>${s.name}</b></td><td>${ok} / ${DATA[k].length}</td><td>${Math.round(100*ok/DATA[k].length)} %</td><td>${bad}</td><td>${blank}</td><td>${mmss(res[k].left)}${res[k].auto?" (temps écoulé)":""}</td></tr>`;
  det+=`<h2 style="margin-top:24px">${s.name}</h2>`;
  DATA[k].forEach((q,i)=>{const y=ans[k][i],st=y===undefined?"blank":(y===q.a?"right":"wrong");if(filter=="wrong"&&st=="right")return;
   const lab=st=="right"?'<span class="tag" style="background:#1a7f37">Correct</span>':st=="wrong"?'<span class="tag" style="background:#c0392b">Incorrect</span>':'<span class="tag" style="background:#e67e22">Sans réponse</span>';
   const L=v=>v===undefined?"aucune":(k=="verbal"?VL[v]:LET[v]+(k=="numerical"?" ("+q.opts[v]+")":""));
   det+=`<div class="card qc ${st}"><div class="row"><b>${s.name.replace("Raisonnement ","")} – question ${i+1}</b>${lab}</div><hr>${body(k,q,y,"rev")}
   <div class="expl"><b>Votre réponse :</b> ${L(y)}<br><b>Bonne réponse :</b> ${L(q.a)}<br><b>Explication :</b> ${q.e}${st!="right"?"<br><span class='small'>"+hint(k,q,y)+"</span>":""}</div></div>`})});
 const verb=(()=>{let m=0;DATA.verbal.forEach((q,i)=>{const y=ans.verbal[i];if(y!==undefined&&y!==q.a&&(y=="F"||q.a=="F")&&(y=="I"||q.a=="I"))m++});return m})();
 let adv=[];SECS.forEach(s=>{if(res[s.k].left<=60&&!res[s.k].auto)adv.push(`${s.name} : il vous restait moins d'une minute, travaillez le rythme.`);if(res[s.k].auto)adv.push(`${s.name} : temps écoulé avant la fin, vous avez perdu des points faute de temps.`);if(res[s.k].left>=s.min*60*.3/(fast?10:1))adv.push(`${s.name} : beaucoup de temps restant (${mmss(res[s.k].left)}), utilisez-le pour relire.`)});
 if(verb)adv.push(`Verbal : ${verb} erreur(s) de confusion entre « Faux » et « Impossible à dire ». Le test est de savoir si le texte contredit l'affirmation (faux) ou ne permet simplement pas de conclure (impossible à dire).`);
 app.innerHTML=`<div class="card"><h2>Rapport du test (${setName})</h2><table class="sum" style="border-collapse:collapse;margin:auto"><tr><th></th><th>Score</th><th>%</th><th>Erreurs</th><th>Sans réponse</th><th>Temps restant</th></tr>${rows}<tr><td style="text-align:left"><b>Total</b></td><td><b>${tot} / ${max}</b></td><td><b>${Math.round(100*tot/max)} %</b></td><td></td><td></td><td></td></tr></table>
 ${adv.length?"<h3>Points d'attention</h3><ul>"+adv.map(a=>"<li>"+a+"</li>").join("")+"</ul>":""}
 <div class="row noprint"><button onclick="report('all')" class="${filter=="all"?"":"sec"}">Toutes les questions</button><button onclick="report('wrong')" class="${filter=="wrong"?"":"sec"}">Seulement mes erreurs</button><button class="sec" onclick="window.print()">Imprimer / PDF</button><button class="sec" onclick="location.reload()">Recommencer</button></div></div>`+det;window.scrollTo(0,0)}
function hint(k,q,y){if(y===undefined)return "Vous n'avez pas répondu : en cas de doute, donnez toujours une réponse.";
 if(k=="verbal"){if(y=="I"&&q.a!="I")return "Vous avez conclu que le texte ne permettait pas de répondre, alors qu'il contient l'information nécessaire (parfois un calcul à faire à partir des chiffres donnés).";if(q.a=="I")return "Le texte ne permet pas de conclure : ne rajoutez pas d'information extérieure ou de déduction non écrite.";return "Relisez la phrase précise du texte qui confirme ou contredit l'affirmation."}
 if(k=="numerical")return "Refaites le calcul pas à pas à la calculatrice et vérifiez l'ordre des opérations et les arrondis ; repérez aussi le piège d'une option proche de la bonne.";
 return "Identifiez chaque règle séparément (rotation, nombre, couleur, position) puis vérifiez-les une par une sur la série avant de choisir."}
const cd=$("#cd");let expr="";
"7894/ 4561* 1230- 0.=+ C".split(" ").forEach(r=>[...r].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>{if(c=="C"){expr=""}else if(c=="="){try{expr=String(+eval(expr||"0").toFixed(8))}catch(e){expr=""}}else expr+=c;cd.value=expr||"0"};document.querySelector("#calc .k").appendChild(b)}));
function toggleCalc(){const c=$("#calc");c.style.display=c.style.display=="block"?"none":"block"}
intro();
</script></body></html>
