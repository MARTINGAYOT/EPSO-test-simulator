const SECS=[{k:"verbal",name:"Raisonnement verbal",min:35},{k:"numerical",name:"Raisonnement numérique",min:20},{k:"abstract",name:"Raisonnement abstrait",min:10}];
let si=0,qi=0,left=0,tick=null,ans={verbal:[],numerical:[],abstract:[]},flag={verbal:[],numerical:[],abstract:[]},done={};
const $=s=>document.querySelector(s),app=$("#app");
const fast=location.search.includes("fast"); // ?fast => chrono /10 pour tester
function intro(){ $("#timer").style.display="none";$("#sec").textContent="";
 app.innerHTML=`<div class="card"><h2>Test d'entraînement complet</h2>
 <p>Reproduit l'enchaînement et les durées du test EPSO : verbal (20 questions, 35 min), numérique (10 questions, 20 min), abstrait (10 questions, 10 min).</p>
 <ul><li>Chronomètre en haut à droite ; à la fin du temps, l'épreuve se ferme automatiquement.</li><li>Navigation libre dans une épreuve, drapeau « à revoir », mais <b>pas de retour</b> à une épreuve terminée.</li><li>Calculatrice disponible en numérique.</li><li>Ne fermez pas l'onglet : le test se perd au rechargement.</li></ul>
 <p class="small">Outil d'entraînement non officiel, sans lien avec l'EPSO. Questions originales.</p>
 <div class="row"><button onclick="startSec(0)">Commencer l'épreuve 1 – Verbal</button><button class="sec" onclick="startSec(1)">Seulement Numérique</button><button class="sec" onclick="startSec(2)">Seulement Abstrait</button></div></div>`}
function startSec(i){si=i;qi=0;const s=SECS[i];left=s.min*60/(fast?10:1);
 app.innerHTML=`<div class="card"><h2>${s.name}</h2><p>${DATA[s.k].length} questions – ${s.min} minutes.</p>${s.k=="verbal"?"<p>Répondez d'après le texte uniquement : Vrai, Faux ou Impossible à dire.</p>":""}<button onclick="begin()">Démarrer le chronomètre</button></div>`}
function begin(){$("#timer").style.display="";$("#sec").textContent=SECS[si].name;$("#calc").style.display="none";clearInterval(tick);tick=setInterval(()=>{left--;if(left<=0){finish(true)}paint()},1000);paint();render()}
function paint(){const m=Math.floor(left/60),s=left%60;const t=$("#timer");t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");t.classList.toggle("low",left<=60)}
function render(){const k=SECS[si].k,q=DATA[k][qi],n=DATA[k].length;let h="";
 h+=`<div class="card"><div class="row"><b>Question ${qi+1} / ${n}</b><span class="sp"></span>${k=="numerical"?'<button class="sec" onclick="toggleCalc()">Calculatrice</button>':""}<button class="sec" onclick="fl()">${flag[k][qi]?"Retirer le drapeau":"Marquer à revoir"}</button></div><hr>`;
 if(k=="verbal"){h+=`<div class="passage">${q.passage}</div><p><b>${q.q}</b></p>`+[["V","Vrai"],["F","Faux"],["I","Impossible à dire"]].map(([c,l])=>`<label class="opt ${ans[k][qi]==c?"sel":""}" onclick="pick('${c}')">${l}</label>`).join("")}
 else if(k=="numerical"){if(q.table)h+=`<table class="d">${q.table.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("")}</table>`;h+=`<p><b>${q.q}</b></p>`+q.opts.map((o,i)=>`<label class="opt ${ans[k][qi]===i?"sel":""}" onclick="pick(${i})">${"ABCDE"[i]}. ${o}</label>`).join("")}
 else{h+=`<p>Quelle figure complète la série ?</p>`;
  if(q.matrix){const c=q.seq.concat([q.q]);h+=`<div class="grid3">${c.map(s=>`<div>${s}</div>`).join("")}</div>`}
  else h+=`<div class="seq">${q.seq.concat([q.q]).map(s=>`<div class="fig">${s}</div>`).join("")}</div>`;
  h+=`<div class="opts">${q.opts.map((o,i)=>`<div class="ob ${ans[k][qi]===i?"sel":""}" onclick="pick(${i})"><div class="fig">${o}</div><b>${"ABCDE"[i]}</b></div>`).join("")}</div>`}
 h+=`</div><div class="card"><div class="nav">${DATA[k].map((_,i)=>`<button class="${ans[k][i]!==undefined?"ans":""} ${flag[k][i]?"flag":""} ${i==qi?"cur":""}" onclick="go(${i})">${i+1}</button>`).join("")}</div>
 <div class="row"><button class="sec" onclick="go(qi-1)" ${qi==0?"disabled":""}>Précédent</button><button class="sec" onclick="go(qi+1)" ${qi==n-1?"disabled":""}>Suivant</button><span class="sp"></span><button onclick="confirmEnd()">Terminer l'épreuve</button></div><p class="small">Réponses : ${ans[k].filter(x=>x!==undefined).length}/${n} · Drapeaux : ${flag[k].filter(Boolean).length}</p></div>`;
 app.innerHTML=h}
function pick(v){ans[SECS[si].k][qi]=v;render()}function go(i){const n=DATA[SECS[si].k].length;if(i>=0&&i<n){qi=i;render()}}
function fl(){const k=SECS[si].k;flag[k][qi]=!flag[k][qi];render()}
function confirmEnd(){const k=SECS[si].k,u=DATA[k].length-ans[k].filter(x=>x!==undefined).length;if(confirm(u?`${u} question(s) sans réponse. Terminer l'épreuve ?`:"Terminer l'épreuve ?"))finish(false)}
function finish(auto){clearInterval(tick);$("#calc").style.display="none";done[SECS[si].k]=left;
 const next=si+1;const nxt=next<3&&!done[SECS[next].k];
 app.innerHTML=`<div class="card"><h2>${SECS[si].name} terminée</h2>${auto?"<p>Le temps est écoulé.</p>":""}<p>Temps restant : ${Math.floor(Math.max(left,0)/60)} min ${Math.max(left,0)%60} s</p>
 ${nxt?`<button onclick="startSec(${next})">Passer à l'épreuve suivante</button>`:""} <button class="sec" onclick="results()">Voir les résultats</button></div>`;$("#timer").style.display="none"}
function results(){let tot=0,max=0,h=`<div class="card"><h2>Résultats</h2>`;
 SECS.forEach(s=>{if(done[s.k]===undefined)return;const k=s.k;let ok=0;DATA[k].forEach((q,i)=>{if(ans[k][i]===q.a)ok++});tot+=ok;max+=DATA[k].length;
  h+=`<p><b>${s.name}</b> : ${ok} / ${DATA[k].length} (${Math.round(100*ok/DATA[k].length)} %) · temps restant ${Math.floor(Math.max(done[k],0)/60)} min ${Math.max(done[k],0)%60} s</p>`});
 h+=`<p><b>Total : ${tot} / ${max}</b></p><button onclick="location.reload()">Recommencer</button></div>`;
 SECS.forEach(s=>{if(done[s.k]===undefined)return;const k=s.k;h+=`<div class="card"><h2>Corrigé – ${s.name}</h2>`;
  DATA[k].forEach((q,i)=>{const y=ans[k][i],g=y===q.a;const L=v=>v===undefined?"–":(k=="verbal"?v:"ABCDE"[v]);
   h+=`<p><b>${i+1}.</b> <span class="${g?"ok":"ko"}">${g?"Correct":"Incorrect"}</span> – votre réponse : ${L(y)} ; bonne réponse : ${L(q.a)}<br><span class="small">${q.e}</span></p>`});h+="</div>"});
 app.innerHTML=h;window.scrollTo(0,0)}
const cd=$("#cd");let expr="";
"7894/ 4561* 1230- 0.=+ C".split(" ").forEach(r=>[...r].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>{if(c=="C"){expr=""}else if(c=="="){try{expr=String(+eval(expr||"0").toFixed(8))}catch(e){expr=""}}else expr+=c;cd.value=expr||"0"};document.querySelector("#calc .k").appendChild(b)}));
function toggleCalc(){const c=$("#calc");c.style.display=c.style.display=="block"?"none":"block"}
intro();
</script></body></html>
