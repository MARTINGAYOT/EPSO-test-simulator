: [{"title": "T1", "passage": "Le programme Erasmus-Pro a financé 4 800 stages en 2023, soit 20 % de plus qu'en 2022. Parmi les stagiaires, 65 % étaient des femmes. Le budget total était de 36 millions d'euros, dont 70 % provenaient du budget européen, le reste de cofinancements nationaux. La durée moyenne des stages était de 4 mois. Aucune donnée n'est disponible pour les stages financés uniquement par des régions.", "q": "Le programme a financé 4 000 stages en 2022.", "a": "V", "e": "4 800 / 1,2 = 4 000."}, {"title": "T1", "passage": "Le programme Erasmus-Pro a financé 4 800 stages en 2023, soit 20 % de plus qu'en 2022. Parmi les stagiaires, 65 % étaient des femmes. Le budget total était de 36 millions d'euros, dont 70 % provenaient du budget européen, le reste de cofinancements nationaux. La durée moyenne des stages était de 4 mois. Aucune donnée n'est disponible pour les stages financés uniquement par des régions.", "q": "Moins de 2 000 stagiaires étaient des hommes.", "a": "V", "e": "35 % de 4 800 = 1 680."}, {"title": "T1", "passage": "Le programme Erasmus-Pro a financé 4 800 stages en 2023, soit 20 % de plus qu'en 2022. Parmi les stagiaires, 65 % étaient des femmes. Le budget total était de 36 millions d'euros, dont 70 % provenaient du budget européen, le reste de cofinancements nationaux. La durée moyenne des stages était de 4 mois. Aucune donnée n'est disponible pour les stages financés uniquement par des régions.", "q": "Les cofinancements nationaux ont dépassé 11 millions d'euros.", "a": "F", "e": "30 % de 36 M€ = 10,8 M€, soit moins de 11 M€."}, {"title": "T1", "passage": "Le programme Erasmus-Pro a financé 4 800 stages en 2023, soit 20 % de plus qu'en 2022. Parmi les stagiaires, 65 % étaient des femmes. Le budget total était de 36 millions d'euros, dont 70 % provenaient du budget européen, le reste de cofinancements nationaux. La durée moyenne des stages était de 4 mois. Aucune donnée n'est disponible pour les stages financés uniquement par des régions.", "q": "Les stages financés par des régions étaient plus courts que la moyenne.", "a": "I", "e": "Le texte dit qu'aucune donnée n'est disponible sur ces stages."}, {"title": "T2", "passage": "Tout fonctionnaire qui souhaite télétravailler doit en faire la demande à son supérieur. Le supérieur dispose de dix jours pour répondre. En l'absence de réponse au terme de ce délai, la demande est réputée acceptée, sauf pour les agents en période d'essai, dont la demande doit toujours recevoir une réponse expresse. Tout refus doit être motivé par écrit.", "q": "La demande d'un agent en période d'essai restée sans réponse après dix jours n'est pas réputée acceptée.", "a": "V", "e": "L'acceptation tacite ne s'applique pas aux agents en période d'essai."}, {"title": "T2", "passage": "Tout fonctionnaire qui souhaite télétravailler doit en faire la demande à son supérieur. Le supérieur dispose de dix jours pour répondre. En l'absence de réponse au terme de ce délai, la demande est réputée acceptée, sauf pour les agents en période d'essai, dont la demande doit toujours recevoir une réponse expresse. Tout refus doit être motivé par écrit.", "q": "Un supérieur peut refuser une demande de télétravail sans en indiquer les raisons.", "a": "F", "e": "Tout refus doit être motivé par écrit."}, {"title": "T2", "passage": "Tout fonctionnaire qui souhaite télétravailler doit en faire la demande à son supérieur. Le supérieur dispose de dix jours pour répondre. En l'absence de réponse au terme de ce délai, la demande est réputée acceptée, sauf pour les agents en période d'essai, dont la demande doit toujours recevoir une réponse expresse. Tout refus doit être motivé par écrit.", "q": "Un agent titulaire dont le supérieur n'a pas répondu après onze jours peut télétravailler.", "a": "V", "e": "Le délai de dix jours est dépassé : la demande est réputée acceptée."}, {"title": "T2", "passage": "Tout fonctionnaire qui souhaite télétravailler doit en faire la demande à son supérieur. Le supérieur dispose de dix jours pour répondre. En l'absence de réponse au terme de ce délai, la demande est réputée acceptée, sauf pour les agents en période d'essai, dont la demande doit toujours recevoir une réponse expresse. Tout refus doit être motivé par écrit.", "q": "Les agents en période d'essai n'ont pas le droit de télétravailler.", "a": "I", "e": "Le texte précise seulement la procédure applicable à leur demande."}, {"title": "T3", "passage": "Un sondage mené auprès de 1 200 habitants d'une région indique que 55 % d'entre eux utilisent quotidiennement les services administratifs en ligne. Parmi ces utilisateurs quotidiens, 80 % se disent satisfaits. Parmi ceux qui ne les utilisent pas quotidiennement, 30 % se disent satisfaits. Le sondage ne précise pas l'âge des répondants.", "q": "Plus de la moitié des personnes interrogées se disent satisfaites.", "a": "V", "e": "528 + 162 = 690 satisfaits sur 1 200, soit 57,5 %."}, {"title": "T3", "passage": "Un sondage mené auprès de 1 200 habitants d'une région indique que 55 % d'entre eux utilisent quotidiennement les services administratifs en ligne. Parmi ces utilisateurs quotidiens, 80 % se disent satisfaits. Parmi ceux qui ne les utilisent pas quotidiennement, 30 % se disent satisfaits. Le sondage ne précise pas l'âge des répondants.", "q": "162 répondants qui n'utilisent pas quotidiennement ces services se disent satisfaits.", "a": "V", "e": "540 x 30 % = 162."}, {"title": "T3", "passage": "Un sondage mené auprès de 1 200 habitants d'une région indique que 55 % d'entre eux utilisent quotidiennement les services administratifs en ligne. Parmi ces utilisateurs quotidiens, 80 % se disent satisfaits. Parmi ceux qui ne les utilisent pas quotidiennement, 30 % se disent satisfaits. Le sondage ne précise pas l'âge des répondants.", "q": "Les jeunes utilisent davantage ces services que les personnes âgées.", "a": "I", "e": "L'âge des répondants n'est pas précisé."}, {"title": "T3", "passage": "Un sondage mené auprès de 1 200 habitants d'une région indique que 55 % d'entre eux utilisent quotidiennement les services administratifs en ligne. Parmi ces utilisateurs quotidiens, 80 % se disent satisfaits. Parmi ceux qui ne les utilisent pas quotidiennement, 30 % se disent satisfaits. Le sondage ne précise pas l'âge des répondants.", "q": "Il y a plus de répondants insatisfaits parmi les utilisateurs quotidiens que parmi les autres.", "a": "F", "e": "132 insatisfaits chez les utilisateurs quotidiens contre 378 chez les autres."}, {"title": "T4", "passage": "Un rapport d'audit conclut que le service des achats a respecté les procédures dans 92 % des 250 marchés examinés. Les marchés non conformes concernaient principalement des montants inférieurs à 10 000 euros. Le rapport recommande de renforcer la formation des agents, sans exclure d'autres mesures. La direction a indiqué qu'elle examinerait ces recommandations avant la fin de l'année.", "q": "Vingt marchés examinés n'étaient pas conformes aux procédures.", "a": "V", "e": "8 % de 250 = 20."}, {"title": "T4", "passage": "Un rapport d'audit conclut que le service des achats a respecté les procédures dans 92 % des 250 marchés examinés. Les marchés non conformes concernaient principalement des montants inférieurs à 10 000 euros. Le rapport recommande de renforcer la formation des agents, sans exclure d'autres mesures. La direction a indiqué qu'elle examinerait ces recommandations avant la fin de l'année.", "q": "Le rapport recommande uniquement de renforcer la formation des agents.", "a": "F", "e": "Il n'exclut pas d'autres mesures."}, {"title": "T4", "passage": "Un rapport d'audit conclut que le service des achats a respecté les procédures dans 92 % des 250 marchés examinés. Les marchés non conformes concernaient principalement des montants inférieurs à 10 000 euros. Le rapport recommande de renforcer la formation des agents, sans exclure d'autres mesures. La direction a indiqué qu'elle examinerait ces recommandations avant la fin de l'année.", "q": "La direction a accepté de mettre en oeuvre toutes les recommandations.", "a": "I", "e": "Elle a seulement indiqué qu'elle les examinerait."}, {"title": "T4", "passage": "Un rapport d'audit conclut que le service des achats a respecté les procédures dans 92 % des 250 marchés examinés. Les marchés non conformes concernaient principalement des montants inférieurs à 10 000 euros. Le rapport recommande de renforcer la formation des agents, sans exclure d'autres mesures. La direction a indiqué qu'elle examinerait ces recommandations avant la fin de l'année.", "q": "La majorité des marchés non conformes portaient sur des montants supérieurs à 10 000 euros.", "a": "F", "e": "Ils concernaient principalement des montants inférieurs à 10 000 euros."}, {"title": "T5", "passage": "Une directive prévoit que les États membres la transposent avant le 1er janvier 2025. Les États qui n'ont pas transposé la directive à cette date s'exposent à une procédure d'infraction. Au 1er février 2025, vingt États sur vingt-sept avaient transposé la directive ; les sept autres étaient en retard. Parmi ces sept États, trois ont indiqué qu'ils achèveraient la transposition dans les six mois.", "q": "Au 1er février 2025, plus de 70 % des États membres avaient transposé la directive.", "a": "V", "e": "20 / 27 = 74 %."}, {"title": "T5", "passage": "Une directive prévoit que les États membres la transposent avant le 1er janvier 2025. Les États qui n'ont pas transposé la directive à cette date s'exposent à une procédure d'infraction. Au 1er février 2025, vingt États sur vingt-sept avaient transposé la directive ; les sept autres étaient en retard. Parmi ces sept États, trois ont indiqué qu'ils achèveraient la transposition dans les six mois.", "q": "La Commission a ouvert une procédure d'infraction contre les sept États en retard.", "a": "I", "e": "Le texte dit qu'ils s'y exposent, pas qu'une procédure a été ouverte."}, {"title": "T5", "passage": "Une directive prévoit que les États membres la transpose "#111\" stroke-width=\"2\"/><circle cx=\"77.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><\/svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"1\" y=\"1\" width=\"98\" height=\"98\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"23.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><\/svg>"], "q": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"1\" y=\"1\" width=\"98\" height=\"98\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"50\" y=\"68\" text-anchor=\"middle\" font-size=\"60\" font-weight=\"bold\" font-family=\"Arial\">?<\/text><\/svg>", "opts": ["<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"1\" y=\"1\" width=\"98\" height=\"98\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"23.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"77.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"23.0\" cy=\"70.2\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><\/svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"1\" y=\"1\" width=\"98\" height=\"98\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"23.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"77.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"23.0\" cy=\"70.2\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50.0\" cy=\"70.2\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"77.0\" cy=\"70.2\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><\/svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"1\" y=\"1\" width=\"98\" height=\"98\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"23.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"77.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><\/svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"1\" y=\"1\" width=\"98\" height=\"98\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"23.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"77.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"23.0\" cy=\"70.2\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50.0\" cy=\"70.2\" r=\"7.2\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><\/svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"1\" y=\"1\" width=\"98\" height=\"98\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"23.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"77.0\" cy=\"29.8\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"23.0\" cy=\"70.2\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50.0\" cy=\"70.2\" r=\"7.2\" fill=\"#111\" stroke=\"#111\" stroke-width=\"2\"/><\/svg>"], "a": 4, "e": "Dans chaque ligne, la troisième case contient autant de points que la somme des deux premières (1+2=3, 2+1=3, 3+2=5).", "matrix": true}]},{"verbal": [{"passage": "La directive sur la performance énergétique des bâtiments prévoit que, à partir de 2030, tout nouveau bâtiment résidentiel devra être à émissions nulles. Les États membres doivent aussi établir des plans nationaux de rénovation pour améliorer progressivement le parc existant, qui représente environ 36 % des émissions de gaz à effet de serre de l'Union liées à l'énergie. Les rénovations les plus profondes visent en priorité les bâtiments les moins performants. La Commission reconnaît que le coût initial reste un obstacle pour de nombreux propriétaires et encourage des mécanismes de financement ciblés.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Les propriétaires qui n'ont pas les moyens de rénover leur bien en sont dispensés.", "Les nouveaux bâtiments résidentiels devront avoir des émissions nulles à partir de 2030.", "Le parc existant produit la majorité des émissions de gaz à effet de serre de l'Union.", "Les rénovations les plus profondes concernent d'abord les bâtiments les plus récents."], "a": 1, "kinds": ["U", "OK", "C", "C"], "why": ["Le texte parle d'un obstacle financier et de mécanismes de financement, mais ne prévoit aucune dispense.", "Énoncé explicitement dans la première phrase.", "Il représente environ 36 % des émissions liées à l'énergie, soit moins de la moitié.", "Elles visent en priorité les bâtiments les moins performants."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Énoncé explicitement dans la première phrase.", "mc": true}, {"passage": "Dans plusieurs États membres, le recours au télétravail a nettement augmenté depuis 2020. Selon une enquête, les salariés qui travaillent à distance au moins deux jours par semaine déclarent un meilleur équilibre entre vie professionnelle et vie privée, mais aussi une difficulté accrue à déconnecter le soir. Les employeurs, eux, relèvent des gains de productivité sur les tâches individuelles, mais une baisse des échanges informels entre collègues. Plusieurs organisations syndicales demandent un droit à la déconnexion inscrit dans la législation.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Les employeurs constatent une baisse de productivité sur toutes les tâches.", "Le droit à la déconnexion est déjà inscrit dans la législation de tous les États membres.", "Le télétravail réduit les coûts de l'entreprise de manière significative.", "Le télétravail présente à la fois des avantages et des difficultés, selon les salariés comme selon les employeurs."], "a": 3, "kinds": ["C", "C", "U", "OK"], "why": ["Ils relèvent des gains sur les tâches individuelles.", "Des syndicats demandent qu'il soit inscrit dans la législation, ce qui suppose qu'il ne l'est pas partout.", "Le texte ne mentionne aucun effet sur les coûts.", "Équilibre vie privée mais difficulté à déconnecter pour les salariés ; gains de productivité mais moins d'échanges informels pour les employeurs."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Équilibre vie privée mais difficulté à déconnecter pour les salariés ; gains de productivité mais moins d'échanges informels pour les employeurs.", "mc": true}, {"passage": "L'indication géographique protégée garantit qu'un produit possède une qualité, une réputation ou d'autres caractéristiques liées à son origine géographique. Elle est accordée au niveau de l'Union pour des produits agricoles comme le fromage ou le vin, mais pas encore pour les produits non agricoles tels que la céramique ou la coutellerie, qui ne bénéficient que de protections nationales. Une proposition législative visant à étendre la protection aux produits artisanaux et industriels est en discussion.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Un fabricant de céramique ne peut pas, aujourd'hui, obtenir une indication géographique protégée valable dans toute l'Union.", "L'extension de la protection aux produits artisanaux a déjà été adoptée.", "Tous les fromages de l'Union bénéficient d'une indication géographique protégée.", "Les protections nationales sont plus efficaces que la protection européenne."], "a": 0, "kinds": ["OK", "C", "U", "U"], "why": ["Les produits non agricoles comme la céramique ne bénéficient que de protections nationales.", "Elle est seulement en discussion.", "Le texte dit que ce type de protection existe pour certains produits agricoles, pas pour tous.", "Aucune comparaison d'efficacité n'est faite."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Les produits non agricoles comme la céramique ne bénéficient que de protections nationales.", "mc": true}, {"passage": "Un rapport sur la mobilité urbaine indique que, dans les villes de plus de 500 000 habitants, la part des déplacements effectués à vélo est passée de 4 % à 9 % en dix ans, tandis que la part de la voiture individuelle est tombée de 52 % à 45 %. Les auteurs attribuent en partie cette évolution au développement des pistes cyclables protégées, mais précisent que d'autres facteurs, comme le prix des carburants, ont pu jouer. Ils soulignent que les données ne couvrent pas les villes plus petites.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["L'augmentation du vélo s'explique uniquement par les pistes cyclables protégées.", "La part des transports en commun a diminué dans les grandes villes.", "Les données du rapport ne permettent pas de conclure sur l'évolution des déplacements dans les petites villes.", "La part du vélo a plus que triplé en dix ans."], "a": 2, "kinds": ["C", "U", "OK", "C"], "why": ["Les auteurs mentionnent d'autres facteurs possibles, comme le prix des carburants.", "Le rapport ne donne aucun chiffre sur les transports en commun.", "Les auteurs précisent que les données ne couvrent pas les villes plus petites.", "Elle est passée de 4 % à 9 %, soit un peu plus du double."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Les auteurs précisent que les données ne couvrent pas les villes plus petites.", "mc": true}, {"passage": "Les marchés publics représentent environ 14 % du produit intérieur brut de l'Union. Depuis la révision des règles, les pouvoirs adjudicateurs peuvent tenir compte de critères sociaux et environnementaux, et non plus seulement du prix le plus bas. Les petites et moyennes entreprises restent toutefois sous-représentées parmi les attributaires, en raison notamment de la complexité des procédures. La Commission a donc simplifié les formulaires et encourage la division des grands marchés en lots.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Les PME remportent désormais la majorité des marchés publics.", "Les marchés publics représentent près de la moitié du PIB de l'Union.", "La division en lots garantit que les PME obtiendront davantage de marchés.", "Les règles révisées permettent à un pouvoir adjudicateur de ne pas retenir systématiquement l'offre la moins chère."], "a": 3, "kinds": ["C", "C", "U", "OK"], "why": ["Elles restent sous-représentées.", "Ils en représentent environ 14 %.", "La Commission encourage cette pratique, mais le texte ne dit pas qu'elle garantit un résultat.", "Les critères sociaux et environnementaux peuvent être pris en compte, et non plus seulement le prix le plus bas."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Les critères sociaux et environnementaux peuvent être pris en compte, et non plus seulement le prix le plus bas.", "mc": true}, {"passage": "Selon une étude, les entreprises qui ont adopté des programmes de formation continue destinés à tous leurs employés, et pas uniquement à leurs cadres, ont connu un taux de départ volontaire inférieur de 20 % à celui des autres entreprises du même secteur. L'étude précise qu'il s'agit d'une corrélation et que d'autres éléments, tels que la politique salariale, n'ont pas été contrôlés. Les auteurs recommandent de poursuivre les recherches avant de formuler des conseils aux employeurs.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["La formation continue des employés réduit le taux de départ volontaire de 20 %.", "L'étude établit un lien statistique entre la formation continue pour tous et un moindre taux de départ, sans démontrer qu'elle en est la cause.", "Les auteurs conseillent aux employeurs de généraliser la formation continue.", "Les entreprises qui forment uniquement leurs cadres ont le taux de départ le plus élevé."], "a": 1, "kinds": ["C", "OK", "C", "U"], "why": ["L'étude ne démontre pas un effet causal.", "Elle parle de corrélation et indique que d'autres éléments n'ont pas été contrôlés.", "Ils recommandent de poursuivre les recherches avant de conseiller les employeurs.", "Le texte compare avec les autres entreprises du secteur, sans classement de ce type."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Elle parle de corrélation et indique que d'autres éléments n'ont pas été contrôlés.", "mc": true}, {"passage": "Le Parlement européen a adopté une résolution appelant à renforcer la protection des lanceurs d'alerte. Il demande que les personnes qui signalent des irrégularités soient protégées contre les représailles, qu'elles s'adressent d'abord à un canal interne ou directement aux autorités. La résolution n'a toutefois pas de valeur contraignante : il appartient à la Commission de décider si elle présente une proposition législative.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["La résolution du Parlement ne crée pas, par elle-même, d'obligation juridique pour les États membres.", "La Commission est tenue de présenter une proposition législative.", "Un lanceur d'alerte doit d'abord utiliser un canal interne pour être protégé.", "La plupart des États membres ne protègent pas les lanceurs d'alerte."], "a": 0, "kinds": ["OK", "C", "C", "U"], "why": ["Elle n'a pas de valeur contraignante.", "Il lui appartient de décider.", "La protection est demandée qu'il s'adresse d'abord à un canal interne ou directement aux autorités.", "Aucune information n'est donnée sur la situation dans les États membres."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Elle n'a pas de valeur contraignante.", "mc": true}, {"passage": "Le recyclage des emballages en plastique progresse lentement : le taux de recyclage est passé de 38 % à 41 % en cinq ans. Les experts expliquent que de nombreux emballages sont composés de plusieurs matériaux difficiles à séparer et que la collecte sélective reste inégale selon les régions. L'Union s'est fixé pour objectif d'atteindre 50 % d'ici 2025 et 55 % d'ici 2030. Plusieurs pays ont introduit des systèmes de consigne, qui donnent de bons résultats pour les bouteilles.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Le taux de recyclage a diminué au cours des cinq dernières années.", "Les systèmes de consigne ont permis d'atteindre l'objectif de 50 %.", "Au rythme observé sur les cinq dernières années, l'objectif de 50 % pour 2025 risque de ne pas être atteint.", "Les emballages composés d'un seul matériau ne sont pas recyclables."], "a": 2, "kinds": ["C", "C", "OK", "U"], "why": ["Il est passé de 38 % à 41 %.", "Ils donnent de bons résultats pour les bouteilles, mais l'objectif n'est pas atteint.", "Une hausse de 3 points en cinq ans est très inférieure à celle qu'il faudrait pour passer de 41 % à 50 %.", "Le texte dit que les emballages multi-matériaux sont difficiles à séparer, pas que les autres ne sont pas recyclables."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Une hausse de 3 points en cinq ans est très inférieure à celle qu'il faudrait pour passer de 41 % à 50 %.", "mc": true}, {"passage": "Dans certaines régions rurales, l'accès aux soins de santé de proximité se dégrade. Les médecins généralistes y sont en moyenne plus âgés qu'en ville, et un nombre croissant d'entre eux partent à la retraite sans être remplacés. Pour y répondre, plusieurs États ont créé des maisons de santé pluridisciplinaires et autorisé la télémédecine pour certains actes. Les patients âgés, souvent peu familiers des outils numériques, sont les premiers concernés par ces changements.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["La télémédecine remplace désormais tous les actes médicaux en zone rurale.", "Les patients âgés pourraient avoir plus de difficultés que d'autres à utiliser les solutions de télémédecine.", "Les médecins ruraux sont plus nombreux que les médecins urbains.", "Les maisons de santé pluridisciplinaires ont résolu le problème de l'accès aux soins."], "a": 1, "kinds": ["C", "OK", "U", "U"], "why": ["Elle n'est autorisée que pour certains actes.", "Ils sont souvent peu familiers des outils numériques et sont les premiers concernés par les changements.", "Le texte compare leur âge moyen, pas leur nombre.", "Elles ont été créées pour y répondre, mais leur efficacité n'est pas évaluée."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Ils sont souvent peu familiers des outils numériques et sont les premiers concernés par les changements.", "mc": true}, {"passage": "L'Union européenne est le premier partenaire commercial de plusieurs pays d'Afrique du Nord. Un accord conclu récemment prévoit la suppression progressive des droits de douane sur les produits industriels sur une période de dix ans, mais maintient des quotas pour certains produits agricoles sensibles. Des organisations d'agriculteurs européens ont exprimé leur inquiétude quant à la concurrence de produits moins chers. La Commission affirme que des clauses de sauvegarde permettront de réagir en cas de perturbation du marché.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Les droits de douane sur les produits industriels seront supprimés dès l'entrée en vigueur de l'accord.", "Les agriculteurs européens soutiennent unanimement l'accord.", "Les clauses de sauvegarde ont déjà été activées.", "L'accord ne libéralise pas entièrement le commerce de tous les produits agricoles."], "a": 3, "kinds": ["C", "C", "U", "OK"], "why": ["La suppression est progressive, sur dix ans.", "Des organisations ont exprimé leur inquiétude.", "Le texte dit seulement qu'elles permettront de réagir, si nécessaire.", "Des quotas sont maintenus pour certains produits agricoles sensibles."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Des quotas sont maintenus pour certains produits agricoles sensibles.", "mc": true}, {"passage": "Le programme d'échange d'étudiants a permis à plus de dix millions de personnes d'étudier ou de se former à l'étranger depuis sa création. Les évaluations montrent que les anciens participants ont plus de chances de trouver un emploi rapidement et déclarent un sentiment d'appartenance européenne plus fort. Toutefois, les étudiants issus de milieux modestes y participent moins souvent, en raison notamment du coût du séjour. Des bourses complémentaires ont été créées pour corriger ce déséquilibre.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Tous les anciens participants ont trouvé un emploi dans l'année suivant leur retour.", "Les bourses complémentaires ont éliminé les inégalités de participation.", "Le coût d'un séjour à l'étranger est l'un des facteurs qui limitent la participation des étudiants de milieux modestes.", "Les étudiants de milieux modestes ne souhaitent pas étudier à l'étranger."], "a": 2, "kinds": ["C", "U", "OK", "U"], "why": ["Ils ont seulement plus de chances de trouver un emploi rapidement.", "Elles ont été créées pour corriger le déséquilibre, sans que le texte en mesure l'effet.", "Le texte cite le coût du séjour parmi les raisons de leur moindre participation.", "Le texte parle de participation et de coût, pas de souhaits."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Le texte cite le coût du séjour parmi les raisons de leur moindre participation.", "mc": true}, {"passage": "Un nouveau règlement impose aux plateformes numériques de plus de quarante-cinq millions d'utilisateurs de publier chaque année une évaluation des risques que leurs services font peser sur la sécurité des utilisateurs, notamment des mineurs. Les plateformes de taille plus modeste sont soumises à des obligations allégées. En cas de manquement grave, une amende pouvant aller jusqu'à 6 % du chiffre d'affaires annuel mondial peut être infligée.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Une plateforme de vingt millions d'utilisateurs n'est pas soumise à l'obligation d'évaluation annuelle des risques imposée aux plus grandes.", "Toute plateforme qui commet un manquement est condamnée à une amende de 6 % de son chiffre d'affaires.", "Les mineurs sont les seuls utilisateurs visés par l'évaluation des risques.", "Le règlement a réduit le nombre de contenus illégaux en ligne."], "a": 0, "kinds": ["OK", "C", "C", "U"], "why": ["Seules les plateformes dépassant quarante-cinq millions d'utilisateurs ont cette obligation ; les autres ont des obligations allégées.", "Il s'agit d'un plafond pour les manquements graves, et la sanction « peut » être infligée.", "Elle vise la sécurité des utilisateurs, notamment des mineurs.", "Aucun effet du règlement n'est mesuré dans le texte."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Seules les plateformes dépassant quarante-cinq millions d'utilisateurs ont cette obligation ; les autres ont des obligations allégées.", "mc": true}, {"passage": "Les bibliothèques publiques ont connu une évolution importante ces dernières années. Si le nombre de prêts de livres imprimés a diminué de 15 %, la fréquentation des lieux a augmenté, car les usagers s'y rendent pour travailler, participer à des ateliers ou utiliser des ordinateurs. Les responsables de bibliothèques soulignent que cette diversification des usages suppose de repenser l'aménagement des espaces et la formation du personnel.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Les usagers ne viennent plus en bibliothèque pour lire.", "Le personnel des bibliothèques a déjà reçu une formation aux nouveaux usages.", "Le nombre de prêts a diminué de 15 % de plus que la fréquentation n'a augmenté.", "La baisse des prêts de livres imprimés n'a pas entraîné une baisse de la fréquentation des bibliothèques."], "a": 3, "kinds": ["U", "U", "U", "OK"], "why": ["Le texte ne dit pas que la lecture a disparu, seulement que les prêts d'imprimés ont diminué et que d'autres usages se développent.", "Les responsables disent que cela suppose de repenser la formation, rien de plus.", "Aucun chiffre sur l'augmentation de la fréquentation n'est donné.", "La fréquentation a augmenté malgré la baisse de 15 % des prêts."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. La fréquentation a augmenté malgré la baisse de 15 % des prêts.", "mc": true}, {"passage": "Une analyse des politiques de lutte contre le changement climatique montre que la tarification du carbone a permis de réduire les émissions des secteurs concernés, mais qu'elle pèse davantage, en proportion, sur les ménages à faibles revenus, qui consacrent une plus grande part de leur budget à l'énergie. Pour limiter cet effet, plusieurs États reversent une partie des recettes sous forme d'aides ciblées. Les auteurs estiment que sans de telles mesures, le soutien du public à cette politique pourrait s'éroder.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Les ménages à faibles revenus dépensent moins pour l'énergie que les autres ménages en valeur absolue.", "Une partie de l'effet de la tarification du carbone est plus lourde pour les ménages modestes, proportionnellement à leurs revenus.", "Tous les États reversent les recettes de la tarification du carbone aux ménages.", "Le public soutient fermement la tarification du carbone."], "a": 1, "kinds": ["U", "OK", "C", "U"], "why": ["Le texte parle de part du budget, pas de montants absolus.", "Elle pèse davantage, en proportion, sur les ménages à faibles revenus.", "Plusieurs États seulement le font, et une partie des recettes.", "Le texte évoque un risque d'érosion du soutien, sans décrire son niveau actuel."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Elle pèse davantage, en proportion, sur les ménages à faibles revenus.", "mc": true}, {"passage": "Le tourisme représente environ 10 % du produit intérieur brut de plusieurs régions méditerranéennes. La concentration de visiteurs sur quelques mois d'été entraîne toutefois des tensions sur le logement, l'eau et les transports locaux. Certaines municipalités ont introduit des taxes de séjour plus élevées en haute saison ou plafonné le nombre de locations de courte durée. Les professionnels du secteur redoutent que ces mesures ne découragent les visiteurs.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Le tourisme est la première source de revenus dans toutes les régions méditerranéennes.", "Les taxes de séjour ont fait baisser la fréquentation.", "Certaines municipalités ont pris des mesures qui, selon les professionnels du secteur, pourraient décourager les visiteurs.", "Les tensions sur l'eau sont plus fortes que celles sur le logement."], "a": 2, "kinds": ["C", "U", "OK", "U"], "why": ["Il représente environ 10 % du PIB de plusieurs régions, pas de toutes.", "Les professionnels redoutent cet effet, mais le texte n'indique pas qu'il s'est produit.", "Taxes plus élevées et plafonnement des locations ; les professionnels redoutent un effet dissuasif.", "Aucune hiérarchie n'est établie."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Taxes plus élevées et plafonnement des locations ; les professionnels redoutent un effet dissuasif.", "mc": true}, {"passage": "Un laboratoire de recherche a développé une technique de dépistage précoce d'une maladie rare. Dans un essai portant sur 2 000 patients, la technique a permis de détecter 95 % des cas existants, mais elle a aussi produit des résultats faussement positifs chez 4 % des personnes saines. Les chercheurs précisent qu'un résultat positif doit donc toujours être confirmé par un second examen avant tout traitement.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Un résultat positif à ce dépistage ne suffit pas, à lui seul, pour décider d'un traitement.", "La technique détecte tous les cas de la maladie.", "Quatre pour cent des patients testés sont atteints de la maladie.", "La technique est déjà utilisée dans tous les hôpitaux."], "a": 0, "kinds": ["OK", "C", "C", "U"], "why": ["Les chercheurs précisent qu'il doit être confirmé par un second examen.", "Elle en détecte 95 %.", "4 % est le taux de faux positifs chez les personnes saines.", "Le texte ne parle que d'un essai."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Les chercheurs précisent qu'il doit être confirmé par un second examen.", "mc": true}, {"passage": "La directive sur les travailleurs détachés prévoit que les salariés envoyés temporairement dans un autre État membre bénéficient des mêmes conditions de rémunération que les travailleurs locaux. Les cotisations sociales restent en revanche versées dans le pays d'origine pendant une durée maximale de douze mois, prolongeable de six mois sur demande motivée. Les syndicats saluent cette égalité de rémunération mais jugent les contrôles encore insuffisants.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Les travailleurs détachés perçoivent un salaire inférieur à celui des travailleurs locaux.", "Un travailleur détaché peut, dans certaines conditions, rester affilié au système social de son pays d'origine pendant dix-huit mois.", "Les syndicats s'opposent à la directive.", "Les cotisations sociales sont toujours versées dans le pays d'accueil."], "a": 1, "kinds": ["C", "OK", "C", "C"], "why": ["Ils bénéficient des mêmes conditions de rémunération.", "Douze mois, prolongeables de six mois sur demande motivée.", "Ils saluent l'égalité de rémunération ; leurs réserves portent sur les contrôles.", "Elles restent versées dans le pays d'origine pendant une durée maximale."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Douze mois, prolongeables de six mois sur demande motivée.", "mc": true}, {"passage": "L'agriculture biologique couvre aujourd'hui environ 10 % des terres agricoles de l'Union, contre 6 % il y a dix ans. Les rendements y sont en moyenne inférieurs à ceux de l'agriculture conventionnelle, mais les prix de vente sont plus élevés, ce qui compense en partie la différence de revenu pour les exploitants. Certains experts relèvent que la demande des consommateurs progresse plus vite que l'offre dans plusieurs pays.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Les rendements de l'agriculture biologique sont supérieurs à ceux de l'agriculture conventionnelle.", "L'agriculture biologique couvrira bientôt la moitié des terres agricoles.", "L'offre biologique dépasse la demande dans tous les pays.", "Le revenu des exploitants biologiques est, au moins en partie, soutenu par des prix de vente plus élevés."], "a": 3, "kinds": ["C", "U", "C", "OK"], "why": ["Ils sont en moyenne inférieurs.", "Le texte ne fait aucune projection.", "La demande progresse plus vite que l'offre dans plusieurs pays.", "Les prix plus élevés compensent en partie la différence de rendement."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Les prix plus élevés compensent en partie la différence de rendement.", "mc": true}, {"passage": "Le Fonds social européen finance des projets visant à améliorer les perspectives d'emploi, en particulier pour les jeunes et les chômeurs de longue durée. Une évaluation a montré que les programmes associant formation et stage en entreprise ont des taux d'insertion nettement supérieurs à ceux des programmes de formation seule. En revanche, la durée moyenne de ces programmes combinés est plus longue, ce qui explique en partie leur coût plus élevé par participant.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Les programmes combinant formation et stage coûtent en moyenne plus cher par participant que ceux de formation seule.", "Les programmes de formation seule obtiennent les meilleurs taux d'insertion.", "Le Fonds social européen finance uniquement des projets destinés aux jeunes.", "Le coût plus élevé des programmes combinés est entièrement dû à leur durée."], "a": 0, "kinds": ["OK", "C", "C", "C"], "why": ["Leur coût plus élevé par participant est mentionné.", "Ce sont les programmes combinant formation et stage.", "Il vise aussi les chômeurs de longue durée.", "Le texte dit que la durée l'explique « en partie »."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Leur coût plus élevé par participant est mentionné.", "mc": true}, {"passage": "Les cybermenaces visant les infrastructures critiques, comme les réseaux d'énergie et les hôpitaux, augmentent en fréquence. Une directive oblige les opérateurs de ces infrastructures à notifier les incidents importants aux autorités nationales dans un délai de vingt-quatre heures et à mettre en œuvre des mesures de gestion des risques. Elle prévoit aussi une coopération renforcée entre les États membres, notamment pour le partage d'informations sur les menaces.", "q": "Parmi les propositions suivantes, laquelle est correcte ?", "opts": ["Les hôpitaux sont exclus du champ d'application de la directive.", "La directive interdit tout partage d'informations entre États sur les menaces.", "Les opérateurs d'infrastructures critiques doivent signaler rapidement aux autorités nationales les incidents importants.", "Les cyberattaques ont causé des coupures d'électricité dans plusieurs États membres."], "a": 2, "kinds": ["C", "C", "OK", "U"], "why": ["Ils sont cités parmi les infrastructures critiques.", "Elle prévoit au contraire une coopération renforcée.", "Notification des incidents importants dans les vingt-quatre heures.", "Le texte parle d'une augmentation des menaces, pas de conséquences précises."], "e": "La bonne réponse est celle que le texte énonce ou implique directement. Notification des incidents importants dans les vingt-quatre heures.", "mc": true}], "numerical": [{"table": [["Pays", "Recettes fiscales 2021 (M€)", "PIB 2021 (M€)", "Population (millions)"], ["A", "18 400", "62 000", "5,1"], ["B", "25 300", "110 000", "9,8"], ["C", "9 800", "35 000", "3,2"], ["D", "41 200", "160 000", "12,6"], ["E", "7 700", "28 000", "2,9"]], "title": "Recettes fiscales et PIB, 2021", "q": "En 2022, les recettes fiscales du pays B augmentent de 8 % et son PIB de 3 %. Quel est alors, en 2022, le rapport recettes fiscales / PIB du pays B ?", "opts": ["23,0 %", "24,1 %", "25,0 %", "22,4 %", "28,0 %"], "a": 1, "e": "2022 : recettes 25 300 x 1,08 = 27 324 ; PIB 110 000 x 1,03 = 113 300. Rapport = 27 324 / 113 300 = 24,1 %. Piège : 23,0 % est le rapport de 2021 ; 25,0 % vient d'une addition des variations (23 + 8 - 3 = 28 ou approximations)."}, {"table": null, "title": null, "q": "Entre 2019 et 2020, le budget de la recherche d'un pays a augmenté de 12 %. En 2021, il a diminué de 5 % par rapport à 2020 et s'élève à 1 596 millions d'euros. Quel était le budget en 2019 ?", "opts": ["1 500 millions d'euros", "1 492 millions d'euros", "1 680 millions d'euros", "1 436 millions d'euros", "1 788 millions d'euros"], "a": 0, "e": "On remonte dans l'ordre inverse : 2020 = 1 596 / 0,95 = 1 680 ; 2019 = 1 680 / 1,12 = 1 500. Piège : 1 492 vient de 1 596 / 1,07 (on additionne +12 % et -5 %) ; 1 680 est le budget 2020."}, {"table": [["Pays", "Production (milliers de tonnes)", "Part exportée", "Valeur des exportations (millions d'€)"], ["A", "1 250", "32 %", "2 480"], ["B", "980", "45 %", "2 940"], ["C", "640", "25 %", "1 120"], ["D", "1 710", "20 %", "2 052"]], "title": "Production et exportations de fromage", "q": "Quelle est la valeur moyenne, en euros, d'une tonne exportée par le pays A ?", "opts": ["620 €", "62 000 €", "7 750 €", "6 200 €", "3 100 €"], "a": 3, "e": "Tonnes exportées : 1 250 milliers x 32 % = 400 milliers de tonnes = 400 000 t. Valeur : 2 480 millions € = 2 480 000 000 €. 2 480 000 000 / 400 000 = 6 200 €. Pièges d'unités : 620 et 62 000 viennent d'un oubli ou d'un excès de zéros ; 7 750 vient de 2 480 / 320."}, {"table": [["Pays", "Importations (Md€)"], ["A", "84"], ["B", "62"], ["C", "49"], ["Autres pays", "?"]], "title": "Importations de l'Union en provenance de quatre ensembles", "q": "Les pays A, B et C représentent ensemble 3/5 du total des importations de l'Union. Quel est le montant des importations en provenance des autres pays ?", "opts": ["117 Md€", "156 Md€", "130 Md€", "195 Md€", "325 Md€"], "a": 2, "e": "A + B + C = 84 + 62 + 49 = 195 Md€, soit 3/5 du total. Total = 195 x 5/3 = 325. Autres = 325 - 195 = 130 (ou 2/5 de 325). Pièges : 325 est le total ; 195 est la part des trois pays ; 117 = 195 x 0,6."}, {"table": [["Année", "Taux de chômage", "Population active (millions)"], ["2018", "8,4 %", "24,5"], ["2022", "6,9 %", "26,0"]], "title": "Marché du travail", "q": "De combien le nombre de chômeurs a-t-il diminué entre 2018 et 2022 ?", "opts": ["264 000", "390 000", "36 000", "2 058 000", "1 794 000"], "a": 0, "e": "2018 : 24,5 M x 8,4 % = 2,058 M ; 2022 : 26,0 M x 6,9 % = 1,794 M. Différence = 0,264 M = 264 000. Piège : 390 000 = 26,0 M x 1,5 points (on applique la baisse du taux à la seule population de 2022) ; 2 058 000 et 1 794 000 sont les nombres de chômeurs, pas leur différence."}, {"table": [["Langue", "Pages par traducteur et par jour", "Nombre de traducteurs"], ["Français", "9", "12"], ["Allemand", "8", "15"], ["Espagnol", "10", "9"]], "title": "Capacité de traduction", "q": "Un document de 4 200 pages doit être traduit par l'ensemble des traducteurs, qui travaillent au même rythme chaque jour. Combien de jours entiers faut-il au minimum ?", "opts": ["13 jours", "14 jours", "12 jours", "16 jours", "15 jours"], "a": 1, "e": "Capacité par jour : 9 x 12 + 8 x 15 + 10 x 9 = 108 + 120 + 90 = 318 pages. 4 200 / 318 = 13,2. Il faut donc 14 jours entiers (13 jours ne suffisent pas : 13 x 318 = 4 134 pages)."}, {"table": [["Pays", "Population 2019 (millions)", "Population 2022 (millions)", "Dépenses de R&D 2019 (Md€)", "Dépenses de R&D 2022 (Md€)"], ["A", "10,0", "10,2", "8,0", "8,6"], ["B", "6,5", "6,5", "3,9", "4,3"], ["C", "8,0", "8,8", "6,0", "7,92"]], "title": "Dépenses de recherche", "q": "Quelle est l'évolution, en pourcentage, des dépenses de R&D par habitant du pays C entre 2019 et 2022 ?", "opts": ["+32 %", "+22 %", "+10 %", "+20 %", "+12 %"], "a": 3, "e": "Par habitant : 2019 : 6,0 Md€ / 8,0 M = 750 € ; 2022 : 7,92 Md€ / 8,8 M = 900 €. 900 / 750 = 1,20, soit +20 %. Pièges : +32 % est la hausse des dépenses totales ; +10 % est la hausse de la population."}, {"table": [["Devise", "Taux de change (pour 1 €)", "Prix du même appareil"], ["Couronne danoise (DKK)", "7,45", "1 490 DKK"], ["Zloty polonais (PLN)", "4,95", "1 089 PLN"], ["Livre sterling (GBP)", "0,86", "168 GBP"]], "title": "Prix d'un appareil dans trois pays", "q": "Quelle est la différence, en euros, entre le prix le plus élevé et le prix le plus bas de l'appareil ?", "opts": ["20,00 €", "5,35 €", "24,65 €", "27,00 €", "19,65 €"], "a": 2, "e": "En euros : 1 490 / 7,45 = 200,00 ; 1 089 / 4,95 = function cin(c){if(c=="C"){ce="";$("#cexp").textContent=""}else if(c=="⌫"){ce=ce.slice(0,-1)}else if(c=="="){if(!ce)return;try{const ex=ce.replace(/×/g,"*").replace(/÷/g,"/").replace(/,/g,".").replace(/(\d+(\.\d+)?)%/g,"($1/100)");if(!/^[0-9+\-*/().\s]+$/.test(ex))throw 0;const v=Function('"use strict";return ('+ex+')')();if(!isFinite(v))throw 0;$("#cexp").textContent=ce+" =";ce=String(+v.toFixed(10));justEq=true}catch(e){$("#cexp").textContent="Erreur";ce=""}}
 else{if(justEq&&/[0-9.]/.test(c)){ce="";$("#cexp").textContent=""}justEq=false;ce+=c}cshow()}
["C","⌫","%","÷","7","8","9","×","4","5","6","-","1","2","3","+","0",".","(",")","="].forEach(c=>{const b=document.createElement("button");b.textContent=c;if("÷×-+%".includes(c))b.className="op";if(c=="=")b.className="eq";b.onclick=()=>cin(c);document.querySelector("#calc .k").appendChild(b)});
document.addEventListener("keydown",e=>{if(e.target.id=="nt"||$("#calc").style.display!="block")return;const k=e.key;
 if(/^[0-9.()+\-%]$/.test(k)){cin(k);e.preventDefault()}else if(k=="*"){cin("×");e.preventDefault()}else if(k=="/"){cin("÷");e.preventDefault()}else if(k=="Enter"||k=="="){cin("=");e.preventDefault()}else if(k=="Backspace"){cin("⌫");e.preventDefault()}else if(k=="Escape"||k=="Delete"){cin("C")}});
intro();
</script></body></html>
